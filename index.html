<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Undivided: The Integrity Quest. An AI-guided game of character built on Job 31.">
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Undivided</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a plumb line hangs down the left rail through seven gates; the play card sits beside it. Final screen tilts the line by your wholeness. */
:root{
  --bg:#ECEFE9; --surface:#F9FAF6; --sunk:#E2E6DF; --ink:#1B2320; --muted:#59645F; --rule:#C9D0C8;
  --brass:#9A6A14; --brass-soft:#E9D9B6; --verd:#1E5C57; --verd-soft:#D4E6E2; --clay:#A9481F; --clay-soft:#F2DCCF;
  --display:"Gloock", "Iowan Old Style", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#172020; --sunk:#1E2928; --ink:#E6ECE8; --muted:#9BA8A2; --rule:#2E3B39;
  --brass:#D9A64F; --brass-soft:#3A2F1A; --verd:#6CBDB2; --verd-soft:#173230; --clay:#E58058; --clay-soft:#3B2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#172020; --sunk:#1E2928; --ink:#E6ECE8; --muted:#9BA8A2; --rule:#2E3B39;
  --brass:#D9A64F; --brass-soft:#3A2F1A; --verd:#6CBDB2; --verd-soft:#173230; --clay:#E58058; --clay-soft:#3B2219; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;max-width:1120px;margin:0 auto;
  padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:14px 48px}}

/* Rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--display);font-size:30px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.path{position:relative;padding-left:26px;display:flex;flex-direction:column;gap:14px}
.path::before{content:"";position:absolute;left:8px;top:-8px;bottom:6px;width:1.5px;background:var(--brass)}
.node{position:relative;font-size:14px;color:var(--muted);line-height:1.25}
.node::before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--brass)}
.node.done::before{background:var(--brass)}
.node.now{color:var(--ink);font-weight:700}
.node.now::before{background:var(--brass);box-shadow:0 0 0 5px var(--brass-soft)}
.node span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
.purse{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);padding-top:12px;font-size:13px;color:var(--muted)}
.purse b{font-family:var(--mono);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.guidebox{font-size:14px;color:var(--muted);border-left:2px solid var(--verd);padding-left:12px}
.guidebox b{color:var(--verd);display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
@media (max-width:820px){
  .rail{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 18px}
  .brand{font-size:24px}
  .path{flex-direction:row;padding-left:0;gap:6px;order:3;width:100%}
  .path::before{left:0;right:0;top:5px;bottom:auto;width:auto;height:1.5px}
  .node{font-size:0;width:12px;height:12px}
  .node span{display:none}
  .node::before{left:0;top:0}
  .purse{border:0;padding:0;gap:8px;margin-left:auto}
  .guidebox{display:none}
}

/* Main card */
main{min-width:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(44px,8vw,84px);letter-spacing:.01em}
h2{font-size:clamp(28px,4.2vw,40px)}
h3{font-size:22px}
p{margin:0;max-width:66ch}
.lede{font-size:19px;color:var(--muted)}
.scene{font-size:19px;line-height:1.6}
.verse{border-left:2px solid var(--brass);padding:2px 0 2px 14px;font-style:italic;color:var(--muted);max-width:60ch}
.verse cite{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--brass);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brass)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--brass);border:1px solid var(--brass);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.opt.picked{border-color:var(--verd);background:var(--verd-soft)}
.opt:disabled{cursor:default}
.opt:disabled:not(.picked){opacity:.55}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:12px 20px;font-weight:700;cursor:pointer;letter-spacing:.01em}
.btn:disabled{opacity:.4;cursor:default}
a.btn{text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.brass{background:var(--brass);color:var(--surface)}
.btn.small{padding:8px 14px;font-size:14px}
.conseq{background:var(--sunk);border-radius:5px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:3px;background:var(--verd-soft);color:var(--verd)}
.chip.neg{background:var(--clay-soft);color:var(--clay)}
.chip.gold{background:var(--brass-soft);color:var(--brass)}
.ask{border:1px dashed var(--verd);border-radius:5px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.ask b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--verd)}
textarea{width:100%;min-height:72px;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;resize:vertical}
input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;width:100%}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.seg button{text-align:left;background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.seg button b{font-size:16px}
.seg button small{color:var(--muted);font-size:13px;line-height:1.35}
.seg button[aria-pressed=true]{border-color:var(--brass);background:var(--brass-soft)}
.setgroup{display:flex;flex-direction:column;gap:8px}
.setgroup > span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--brass)}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.big{font-family:var(--mono);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.evid{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 14px;border-radius:5px;background:var(--bg);border:1px solid var(--rule);animation:rise .35s ease}
.ev i{font-style:normal;font-family:var(--mono);color:var(--brass);font-size:13px}
.truth{background:var(--brass-soft);border-radius:5px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.tells{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tells div{border-top:2px solid var(--verd);padding-top:8px;font-size:15px}
.tells b{display:block;font-size:15px}
.timer{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--brass);transition:width 1s linear}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.q .opts{gap:6px}
.q .opt{padding:9px 12px;grid-template-columns:24px minmax(0,1fr)}
.q .opt .k{width:22px;height:22px;font-size:11px}
.key{background:var(--clay-soft);border-radius:5px;padding:12px 16px;font-size:15px}
.coin{width:120px;height:120px;border-radius:50%;margin:6px auto;display:grid;place-items:center;font-family:var(--display);font-size:22px;background:radial-gradient(circle at 35% 30%,var(--brass-soft),var(--brass));color:var(--surface);border:3px solid var(--brass)}
.coin.spin{animation:flip .9s ease-in-out}
details.guide{border-top:1px solid var(--rule);padding-top:14px}
details.guide summary{cursor:pointer;font-weight:700}
details.guide > div{display:flex;flex-direction:column;gap:12px;margin-top:12px;font-size:15.5px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.cols h3{font-size:19px;margin-bottom:4px}
.note{font-size:13.5px;color:var(--muted)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tally div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;font-family:var(--mono)}
.tally button{width:28px;height:28px;border-radius:3px;border:1px solid var(--rule);background:var(--surface);cursor:pointer}

/* Final */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:24px;align-items:center}
@media (max-width:560px){.verdict{grid-template-columns:minmax(0,1fr)}}
.iq{font-family:var(--display);font-size:clamp(80px,14vw,132px);line-height:.9}
.iq small{font-family:var(--mono);font-size:14px;letter-spacing:.14em;color:var(--muted);display:block;margin-top:8px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.trio div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.trio b{font-family:var(--mono);font-size:28px;font-variant-numeric:tabular-nums}
.trio span{font-size:13px;color:var(--muted)}
@media (max-width:520px){.trio{grid-template-columns:minmax(0,1fr)}}
.mirrors{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mirror{border:1px solid var(--rule);border-radius:5px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.mirror .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mirror .top b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.mirror p{font-size:15px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:14.5px}
.bar .tr{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--verd)}
.bar.low .tr i{background:var(--clay)}
.bar.found .tr i{background:var(--brass)}
.bar em{font-style:normal;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,1fr) 44px}.bar .tr{grid-column:1/-1;order:3}}
.book{background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.book .defense{font-family:var(--display);font-size:19px;line-height:1.5;white-space:pre-line}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.missions div{border:1px solid var(--rule);border-radius:5px;padding:12px 14px;background:var(--surface);font-size:15px;display:flex;flex-direction:column;gap:4px}
.missions b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.loading{color:var(--muted);font-style:italic}
.plumb{max-width:150px;width:100%;justify-self:center}
.plumb svg{width:100%;height:auto;display:block}
@media (max-width:560px){.plumb{max-width:110px}}
@keyframes rise{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(1080deg)}}
@keyframes sway{0%,100%{transform:rotate(var(--tilt))}50%{transform:rotate(calc(var(--tilt) * .7))}}
.swing{transform-origin:80px 6px;animation:sway 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px}
</style>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------------- Content ---------------- */
const ELS = {
  hon:{f:"Honesty",c:"Honesty"},
  chas:{f:{a:"Chastity & Faithfulness",y:"Purity & Boundaries"},c:"Faithfulness & Boundaries"},
  fair:{f:"Fairness & Equity",c:"Fairness & Equity"},
  char:{f:"Charity",c:"Compassion"},
  fam:{f:"Family",c:"Family & Belonging"},
  pow:{f:"Power & Strength",c:"Use of Power"},
  cont:{f:"Contentment",c:"Contentment"},
  mercy:{f:"Not Vengeful",c:"Mercy"},
  trans:{f:"Transparency",c:"Transparency"},
  opp:{f:"Opportunity",c:"Second Chances"},
  just:{f:"Justice",c:"Justice & Stewardship"}
};
const GATES = [
  null,
  {name:"The Mirror", els:"Honesty · Transparency", foe:"The Deception Dragon",
   v:{f:["Let me be weighed in an even balance, that God may know mine integrity.","Job 31:6 (KJV)"], c:["Integrity is being the same person in the mirror as in the meeting.","Principle of the Mirror"]}},
  {name:"The Garden", els:{f:{a:"Chastity · Faithfulness",y:"Purity · Boundaries"},c:"Faithfulness · Boundaries"}, foe:{a:"The Seducer’s Maze",y:"The Maze of Eyes"},
   v:{f:["I made a covenant with mine eyes; why then should I think upon a maid?","Job 31:1 (KJV)"], c:["Faithfulness starts with where you let your attention rest, long before any choice is made.","Principle of the Garden"]}},
  {name:"The Scales", els:"Fairness · Justice", foe:"The Corrupt Judge",
   v:{f:["Did not he that made me in the womb make him?","Job 31:15 (KJV)"], c:["A fair scale weighs everyone the same, including the person holding it.","Principle of the Scales"]}},
  {name:"The Open Door", els:{f:"Charity · Family",c:"Compassion · Family"}, foe:"The Hoarder’s Grip",
   v:{f:["The stranger did not lodge in the street: but I opened my doors to the traveller.","Job 31:32 (KJV)"], c:["How people treat those who cannot repay them is the truest measure they give.","Principle of the Open Door"]}},
  {name:"The Throne", els:{f:"Power · Strength",c:"Use of Power"}, foe:"The Tyrant’s Crown",
   v:{f:["Doth not he see my ways, and count all my steps?","Job 31:4 (KJV)"], c:["Power does not change people so much as reveal them.","Principle of the Throne"]}},
  {name:"The Vault", els:"Contentment", foe:"The Golden Cage",
   v:{f:["If I have made gold my hope, or have said to the fine gold, Thou art my confidence…","Job 31:24 (KJV)"], c:["You either own your things, or they own you.","Principle of the Vault"]}},
  {name:"The Summit", els:{f:"Not Vengeful · Opportunity",c:"Mercy · Second Chances"}, foe:"The Final Reckoning",
   v:{f:["If I rejoiced at the destruction of him that hated me, or lifted up myself when evil found him…","Job 31:29 (KJV)"], c:["Mercy refuses to let someone else’s wrong decide who you become.","Principle of the Summit"]}}
];
const GATE_END = [null,
  "The Mirror shows what you do when the change is wrong and the room is watching. Hold onto that. The room won’t always be watching.",
  {f:"Job made a covenant with his eyes before he ever made a choice with his hands. Faithfulness starts upstream.",c:"Faithfulness starts upstream, with attention, long before it reaches your hands."},
  "Scales only work if they weigh everyone the same, including the one holding them.",
  "An open door costs something. That is how you know it is open.",
  "Power reveals. Whatever was in a person before the crown, the crown makes louder.",
  "The Vault asks one question: do you own your things, or do they own you?",
  "Mercy is not pretending the wrong didn’t happen. It is refusing to let the wrong decide who you become."
];

// v = consistency value for paired scenes (1 = integrity choice, 0 = not)
const SCN = {
 change:{gate:1, ref:{f:["If I have walked with vanity, or if my foot hath hasted to deceit…","Job 31:5 (KJV)"]},
  text:{a:"Friday lunch with your whole team at the café. You pay with a small note; the cashier, rushing, hands you change for a large one — about a day’s lunch money extra. Your team is right behind you in the queue.",
        y:"Lunch break. The canteen is packed and your friends are right behind you. You paid with a small note, but the attendant hands you change for a big one — enough for a week of snacks."},
  ask:"Would you make the same choice if the queue behind you were empty?",
  opts:[
   {t:"Hand the extra back right away.", d:{hon:3,trans:1}, v:1, c:{a:"The cashier exhales. “My till would have been short. Thank you.” Your team noticed.",y:"The attendant looks relieved. “I’d have paid that from my wages.” Your friends noticed."}},
   {t:"Pocket it. Their mistake, not mine.", d:{hon:-2,cont:-1}, v:0, tal:15, c:"Nobody says anything. One person behind you gives you a look you can’t read."},
   {t:"Joke about my lucky day, and keep it.", d:{hon:-2,trans:-1}, v:0, tal:15, c:"Laughter. The cashier laughs too, and counts the till twice at closing."},
   {t:"Return it, loudly enough that everyone hears.", d:{hon:2,trans:-1}, v:1, c:"A little applause. You enjoy it slightly more than you expected to."}
  ]},
 error:{gate:1, ref:{f:["If I covered my transgressions as Adam, by hiding mine iniquity in my bosom…","Job 31:33 (KJV)"]},
  text:{a:"A report you prepared went to the board last week. You’ve just found a mistake in it: a figure that makes your department look better than it is. Nobody has noticed. Correcting it means saying so at Monday’s meeting.",
        y:"Your test comes back with a mark higher than you earned. The teacher added your marks up wrong, and it lifts you into the top three. Nobody else will ever check."},
  ask:"What would it cost you to be the first to say it? What will it cost if someone else says it first?",
  opts:{
   a:[{t:"Raise it myself at Monday’s meeting.", d:{trans:3,hon:2}, c:"A pause in the room. Then the chair says, “This is why we trust your numbers.”"},
      {t:"Quietly fix it in next quarter’s version.", d:{trans:-1}, flag:"errHidden", c:"No one knows, including the people who made decisions on the wrong number."},
      {t:"Leave it. It’s minor.", d:{hon:-2,trans:-3}, flag:"errHidden", c:"Nothing happens. For now."},
      {t:"Tell my manager privately and let them decide.", d:{trans:2,hon:2}, c:"Your manager raises it and credits you for catching it. Slower, but clean."}],
   y:[{t:"Show the teacher the mistake after class.", d:{trans:3,hon:2}, c:"Your teacher corrects it, and writes “Thank you for your honesty” beside the new mark."},
      {t:"Keep the mark, but study harder next time to deserve it.", d:{trans:-1}, flag:"errHidden", c:"The top-three list goes up on the noticeboard with your name on it."},
      {t:"Say nothing. It’s the teacher’s mistake.", d:{hon:-2,trans:-3}, flag:"errHidden", c:"Nothing happens. For now."},
      {t:"Tell a parent and ask what I should do.", d:{trans:2,hon:2}, c:"Your parent walks with you to see the teacher. It’s awkward for about four minutes."}]}},
 creditSeen:{gate:1, ref:{f:["If I did despise the cause of my manservant or of my maidservant, when they contended with me…","Job 31:13 (KJV)"]},
  text:{a:"In a meeting with the CEO, your quiet junior colleague Tolu suggested the idea that is now saving the project. The CEO turns to you: “Brilliant idea of yours.” Tolu is in the room, looking at the table.",
        y:"In class, the teacher praises “your” answer to the hardest question. Your quiet deskmate Tolu actually worked it out and whispered it to you. Tolu is sitting right there."},
  ask:"Who in this room has the least power to correct the record?",
  opts:[

const $ = s => document.querySelector(s);
function pick(x){
  if(x==null) return x;
  if(typeof x==="object" && !Array.isArray(x)){
    if("a" in x || "y" in x) return pick(S.set==="y" ? (x.y ?? x.a) : (x.a ?? x.y));
    if("f" in x || "c" in x) return pick(S.lens==="f" ? (x.f ?? x.c) : (x.c ?? x.f));
  }
  return x;
}

/* ---------------- Backend (Supabase) ---------------- */
const CFG = window.UNDIVIDED_CONFIG || {};
const backendReady = () => !!(CFG.supabaseUrl && CFG.supabaseKey && !/YOUR-/.test(CFG.supabaseUrl+CFG.supabaseKey));
// The guide's prompts are built on the server (supabase/functions/guide), so the API key and prompts never reach the browser.
async function ai(task, data){
  if(!backendReady()) throw new Error("offline");
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 45000);
  try{
    const r = await fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/functions/v1/guide", {method:"POST", signal:ctl.signal,
      headers:{"Content-Type":"application/json","apikey":CFG.supabaseKey},
      body:JSON.stringify({task, lens:S.lens, setting:S.set, mode:S.mode, data})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok || j.error) throw new Error(j.error || ("guide "+r.status));
    return j.result;
  } finally { clearTimeout(tm); }
}
async function rpc(name, args){
  if(!backendReady()) throw new Error("offline");
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/rpc/"+name, {method:"POST",
    headers:{"Content-Type":"application/json","apikey":CFG.supabaseKey}, body:JSON.stringify(args||{})});
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j && (j.message||j.hint)) || ("rpc "+r.status));
  return j;
}

/* ---------------- Dynamic engine ----------------
   Every scene is a BLUEPRINT: a fixed principle, a fixed moral structure and fixed scoring (SCN above).
   Each play, the guide writes a fresh situation on top of it: new people, setting, stakes and wording.
   Options keep their scoring identity (archetype index) but are shown in a shuffled order.
   If the guide is unavailable, the classic text is used, still shuffled. */

  a:["a family-owned bakery in Lagos","a church building committee","a hospital night shift","a road-construction firm","a fintech start-up","a village farmers' cooperative","a secondary school staff room","a regional bank branch","a ride-hailing driver's week","a government permits office","a non-profit food bank","a football club's board","a law firm partnership","a real-estate agency","an airline crew","a university research lab","a family wedding committee","a tailoring shop","a pharmacy","a trucking company","a mosque or church charity drive","a construction site in Texas","a newsroom","a call centre","an oil-and-gas contractor","a small clinic in Ibadan","a tech company's sales team","a choir and music ministry","a property management office","a city council meeting"],

const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
const pickOne = a => a[Math.floor(Math.random()*a.length)];
function shuffle(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// Generation jobs by gate (paired scenes are written together so they share a principle but not a surface).
const JOBS = [
  {gate:1, kind:"pair", a:"change", b:"checkout"},
  {gate:1, kind:"pair", a:"creditSeen", b:"creditAlone"},
  {gate:1, kind:"scene", id:"error"},
  {gate:2, kind:"scene", id:"garden"},

  {gate:6, kind:"scene", id:"offer"},
  {gate:7, kind:"scene", id:"chat"},
  {gate:7, kind:"scene", id:"return"}
];
const jobKey = j => j.id || (j.a+"+"+j.b);
const inflight = {};
function blueprintOf(id){
  const sc=SCN[id];
  return {gate:GATES[sc.gate].name, principle:pick(GATES[sc.gate].els), pattern:staticText(id),
    options:optsOf(id).map(o=>({t:pick(o.t), c:pick(o.c)}))};
}
function staticText(id){
  let text = pick(SCN[id].text);
  if(id==="chat" && S.set==="a") text = S.flags.firedMarcus
    ? "Marcus, whom you let go in the budget cuts and who has bad-mouthed you ever since, has just been fired from his new job, and everyone knows. Your old team’s group chat is roasting him. You have a screenshot of something he once said that would make it much worse."
    : text.replace("@FOE", "Kunle, a colleague who spread rumours about you for a year,");
  return text;
}
function ctx(){ return {level:S.level, role:S.level===3 ? (S.role||"") : "", world:pickOne(WORLDS[S.set==="y"?"y":"a"])}; }
function validScene(r, n){ return r && typeof r.text==="string" && r.text.length>40 && Array.isArray(r.options) && r.options.length===n && r.options.every(o=>o && typeof o.t==="string" && o.t.length>2); }
async function runJob(j){
  const k=jobKey(j);
  if(inflight[k]) return inflight[k];
  const done = j.kind==="scene"||j.kind==="case" ? S.gen[j.id] : S.gen[j.a];
  if(done) return;
  inflight[k] = (async()=>{
    try{
      if(!backendReady() || S.offline) throw new Error("offline");
      if(j.kind==="scene"){
        const bp=blueprintOf(j.id);
        if(j.id==="error") bp.want_echo=true;
        if(j.id==="chat" && S.flags.firedMarcus) bp.cascade="The person who wronged the player is someone the player personally let go earlier in the game, who has been bad-mouthing them since.";
        const r = await ai("scene", {...ctx(), ...bp});
        if(!validScene(r, bp.options.length)) throw new Error("bad scene");
        S.gen[j.id]={text:r.text, opts:r.options.map(o=>({t:o.t, c:o.c||""})), echo:typeof r.echo==="string"?r.echo:"", src:"ai"};
      } else if(j.kind==="pair"){
        const A=blueprintOf(j.a), B=blueprintOf(j.b);
        const r = await ai("pair", {...ctx(), seen:A, alone:B});
        if(!r || !validScene(r.seen, A.options.length) || !validScene(r.alone, B.options.length)) throw new Error("bad pair");
        S.gen[j.a]={text:r.seen.text, opts:r.seen.options.map(o=>({t:o.t,c:o.c||""})), src:"ai"};
        S.gen[j.b]={text:r.alone.text, opts:r.alone.options.map(o=>({t:o.t,c:o.c||""})), src:"ai"};
      } else if(j.kind==="plank"){
        const r = await ai("plank", {...ctx(), pattern_other:pick(PLANK[j.a].text), pattern_self:pick(PLANK[j.b].text)});
        if(!r || typeof r.other!=="string" || typeof r.self!=="string") throw new Error("bad plank");
        S.gen[j.a]={text:r.other, src:"ai"}; S.gen[j.b]={text:r.self, src:"ai"};
      } else if(j.kind==="case"){
        const truth = Math.random()<0.5;
        const r = await ai("case", {...ctx(), truth, pattern:CASES[j.id].cards.join(" | ")});
        if(!r || typeof r.who!=="string" || !Array.isArray(r.cards) || r.cards.length!==4 || typeof r.reveal!=="string") throw new Error("bad case");
        S.gen[j.id]={who:r.who, cards:r.cards.map(String), reveal:r.reveal, lesson:String(r.lesson||""), truth, src:"ai"};
      }
    }catch(e){
      // Classic fallback: same principle, original wording.
      if(j.kind==="scene") S.gen[j.id]={src:"classic"};
      else if(j.kind==="case") S.gen[j.id]={src:"classic"};
      else { S.gen[j.a]={src:"classic"}; S.gen[j.b]={src:"classic"}; }
    }
    save();
  })();
  try{ await inflight[k]; } finally { delete inflight[k]; }
}
function prepareGate(g){ return Promise.allSettled(JOBS.filter(j=>j.gate===g).map(runJob)); }
function sceneText(id){ const g=S.gen[id]; return g && g.src==="ai" ? g.text : staticText(id); }
function sceneOpt(id, i){ // display text + consequence for archetype i; scoring always from the blueprint
  const g=S.gen[id], base=optsOf(id)[i];
  if(g && g.src==="ai" && g.opts && g.opts[i]) return {...base, t:g.opts[i].t, c:g.opts[i].c || pick(base.c)};
  return base;
}
function orderOf(id, n){ if(!S.order[id] || S.order[id].length!==n) { S.order[id]=shuffle(n); save(); } return S.order[id]; }

function caseStep(app, st){
  const C=caseData(st.id); const rec=S.cases[st.id] || {seen:1};
  S.cases[st.id]=rec;
  const draw=()=>{
    const cards = C.cards.slice(0,rec.seen).map((c,i)=>`<div class="ev"><i>${i+1}/4</i><span>${esc(c)}</span></div>`).join("");
    const decided = rec.verdict!=null;
    app.innerHTML = `<div class="card">
      <div class="eyebrow">Gate ${gateOf(S.step)} · The Discernment</div>
      <h2>Judge the integrity of ${esc(C.who)}</h2>
      <p>Evidence arrives one piece at a time. Judge whenever you’re ready, or keep looking.</p>
      <div class="evid">${cards}</div>
      ${decided ? "" : `
      <label class="field" for="cf">How sure are you?<input type="range" id="cf" min="50" max="100" value="${rec.conf||70}"><div class="scale"><span>50% · A guess</span><b id="cfv">${rec.conf||70}%</b><span>100% · Certain</span></div></label>
      <div class="row"><button class="btn" data-v="1">Has integrity</button><button class="btn" data-v="0">Lacks integrity</button>
      ${rec.seen<4?`<button class="btn ghost" data-v="more">Keep looking</button>`:""}</div>`}
      <div id="after"></div></div>`;
    if(!decided){
      $("#cf").oninput=e=>{ rec.conf=+e.target.value; $("#cfv").textContent=rec.conf+"%"; };
      app.querySelectorAll("[data-v]").forEach(b=> b.onclick=()=>{
        if(b.dataset.v==="more"){ rec.seen++; save(); draw(); return; }
        rec.verdict = b.dataset.v==="1"; rec.conf = +$("#cf").value; save(); draw();
      });
    } else reveal();
  };
  const reveal=()=>{
    const right = rec.verdict===C.truth;
    const sc = caseScore(st.id);
    const remaining = C.cards.slice(rec.seen).map((c,i)=>`<div class="ev"><i>${rec.seen+i+1}/4</i><span>${esc(c)}</span></div>`).join("");
    $("#after").innerHTML = `${remaining?`<p class="note">The evidence you didn’t wait for:</p><div class="evid">${remaining}</div>`:""}
      <div class="truth"><b>What was really going on</b><p>${esc(C.reveal)}</p>
      ${S.exam?"":`<p><b>${right?"You read it right":"You read it wrong"}</b> after ${rec.seen} of 4 pieces of evidence, at ${rec.conf}% confidence. Discernment: ${sc}.</p>`}</div>
      <p>${C.ai||S.lens==="f"?esc(C.lesson):esc(C.lesson.replace(/^Job’s three friends[^.]*\. They were wrong, and confident\. /,"Confident judges are often wrong. "))}</p>
      <div class="setgroup"><span>The four tells of real integrity</span><div class="tells">
        <div><b>Same in the dark</b>Consistent seen and unseen.</div>
        <div><b>Promises kept</b>Especially when keeping them costs.</div>
        <div><b>The powerless</b>How they treat people who can’t repay.</div>
        <div><b>When caught</b>Owning it instead of hiding it.</div></div></div>
      <div class="row"><button class="btn" id="n">Continue</button></div>`;
    $("#n").onclick=next;
  };
  draw();
}
function caseScore(id){
  const C=caseData(id), r=S.cases[id]; if(!r || r.verdict==null) return null;
  return r.verdict===C.truth ? Math.round(60+10*r.seen) : Math.round(clamp(40-(r.conf-50)*0.8));
}

/* ---------------- Scoring ---------------- */
function score(){
  // Elements
  const acc={}; for(const k in ELS) acc[k]={c:0,mn:0,mx:0};
  for(const id in S.ans){
    const opts=optsOf(id); const keys=new Set(); opts.forEach(o=>Object.keys(o.d).forEach(k=>keys.add(k)));
    keys.forEach(k=>{ const vals=opts.map(o=>o.d[k]||0); acc[k].mn+=Math.min(...vals); acc[k].mx+=Math.max(...vals); acc[k].c+=opts[S.ans[id]].d[k]||0; });
  }
  const els={}; for(const k in acc){ const a=acc[k]; els[k]= a.mx>a.mn ? Math.round((a.c-a.mn)/(a.mx-a.mn)*100) : null; }
  const elVals=Object.values(els).filter(v=>v!=null);
  const choices = elVals.length ? Math.round(elVals.reduce((s,v)=>s+v,0)/elVals.length) : 0;

  // Mirror 1: seen vs unseen
  const pairs=[["change","checkout"],["creditSeen","creditAlone"]];
  const pd = pairs.filter(([a,b])=>S.ans[a]!=null&&S.ans[b]!=null).map(([a,b])=>{ const vs=optsOf(a)[S.ans[a]].v, vu=optsOf(b)[S.ans[b]].v; return {a,b,vs,vu,gap:Math.max(0,vs-vu)}; });
  const seen = pd.length ? Math.round(100 - pd.reduce((s,p)=>s+p.gap,0)/pd.length*100) : 100;

  // Mirror 2: say vs do
  let say=100; const notes=[];
  const Q=S.quiz;
  if(Q && Q.done){
    if(Q.keyEarly && !Q.saidUsed){ say-=50; notes.push("You opened the answer key before submitting, then reported that you hadn’t."); }
    else if(Q.keyEarly && Q.saidUsed){ notes.push("You opened the answer key early and said so. That honesty counts."); }
    if(Q.claim>Q.correct){ const pen = Q.keyEarly ? 20 : 8; say-=pen; notes.push(`You scored yourself ${Q.claim}/3; your answers had ${Q.correct}/3 right${Q.keyEarly?" (and you had seen the key)":""}.`); }
    if(!Q.keyEarly && Q.claim<=Q.correct) notes.push(`Quiz: you answered from memory and scored yourself honestly (${Q.claim} claimed, ${Q.correct} right).`);
  }
  const hon = els.hon ?? 50;
  const selfGap = S.selfHonest*10 - hon;
  if(selfGap>20){ const pen=Math.min(30,selfGap-20); say-=pen; notes.push(`You rated your honesty ${S.selfHonest}/10 before the quest; your honesty choices came out at ${hon}%.`); }
  else if(selfGap< -20) notes.push(`You rated your honesty ${S.selfHonest}/10, lower than your choices showed (${hon}%). You may be harder on yourself than you need to be.`);
  else notes.push(`Your opening self-rating (${S.selfHonest}/10) matched your honesty choices (${hon}%) closely.`);
  say=clamp(Math.round(say));

  // Mirror 3: self vs other
  const pl=[["p1o","p1s"],["p2o","p2s"]].filter(([o,s])=>S.planks[o]!=null&&S.planks[s]!=null).map(([o,s])=>({o:S.planks[o],s:S.planks[s]}));
  const gapAvg = pl.length ? pl.reduce((t,p)=>t+(p.o-p.s),0)/pl.length : 0;
  const plank = Math.round(clamp(100 - Math.max(0,gapAvg)*12.5));

  // Mirror 4: fidelity
  const fid = {yes:{market:100,gold:0},no:{market:90,gold:80},maybe:{market:85,gold:45}}[S.promise||"no"][S.road||"gold"];

  const whole = Math.round((seen+say+plank+fid)/4);
  const cs=["femi","bayo"].map(caseScore).filter(v=>v!=null);
  const disc = cs.length ? Math.round(cs.reduce((s,v)=>s+v,0)/cs.length) : 0;
  const iq = Math.round(0.45*choices + 0.40*whole + 0.15*disc);
  const rank = RANKS.find(r=>iq>=r[0]);

  // coins
  let coins=null;
  const real=S.coins.filter(c=>c && !c.digital && !c.council);
  if(S.mode==="council"){
    const cc=S.coins.filter(c=>c&&c.council); const p=cc.reduce((s,c)=>s+c.p,0), h=cc.reduce((s,c)=>s+c.h,0);
    coins={council:true,p,h,prob:tail(p,h)};
  } else if(real.length){ const h=real.filter(c=>c.r==="H").length; coins={n:real.length,h,prob:tail(real.length,h)}; }

  const sorted = Object.entries(els).filter(([,v])=>v!=null).sort((a,b)=>a[1]-b[1]);
  return {els,choices,seen,pd,say,notes,plank,pl,gapAvg,fid,whole,disc,iq,rank,coins,weak:sorted.slice(0,3).map(x=>x[0]),strong:sorted.slice(-2).reverse().map(x=>x[0])};
}
function tail(n,h){ // P(X>=h), X~Bin(n,.5)
  if(n>200){ const m=n/2, sd=Math.sqrt(n)/2; const z=(h-0.5-m)/sd; return 0.5*erfc(z/Math.SQRT2); }
  let p=0; for(let k=h;k<=n;k++) p+=comb(n,k); return p/Math.pow(2,n);
}
function comb(n,k){ let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return r; }
function erfc(x){ const t=1/(1+0.5*Math.abs(x)); const y=t*Math.exp(-x*x-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277))))))))); return x>=0?y:2-y; }

/* ---------------- Final ---------------- */
function plumbSVG(whole){
  const tilt = ((100-whole)/100*22).toFixed(1);
  return `<svg viewBox="0 0 160 210" role="img" aria-label="Plumb line tilted ${tilt} degrees from true">
    <line x1="80" y1="6" x2="80" y2="204" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 4"/>
    <rect x="40" y="0" width="80" height="6" fill="var(--ink)"/>
    <g class="swing" style="--tilt:${tilt}deg">
      <line x1="80" y1="6" x2="80" y2="170" stroke="var(--brass)" stroke-width="1.5"/>
      <path d="M70 170 L90 170 L80 198 Z" fill="var(--brass)"/>
    </g>
    <text x="80" y="208" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)">TRUE</text>
  </svg>`;
}

function final(app){
  const R=score();
  const council=S.mode==="council";
  const who = S.name || (council?"The Council":"Traveller");
  const pdText = R.pd.map(p=>{
    const gen = S.gen[p.a] && S.gen[p.a].src==="ai";
    const nm = p.a==="change"
      ? (gen ? "Pair 1 (honesty with money): first with people watching, later alone" : "Wrong change with people watching, then the unscanned item alone")
      : (gen ? "Pair 2 (giving credit where it’s due): first in front of others, later alone" : "Credit for Tolu’s idea in front of others, then alone with the slides");
    return `${nm}: ${p.vs>p.vu?"<b>you did better when watched</b>":(p.vs<p.vu?"you did better alone":"the same person both times")}.`;
  }).join(" ");
  const pl = R.pl.length ? (R.gapAvg>0.5 ? `You rated others’ wrongs ${R.gapAvg.toFixed(1)} points more serious than the same wrongs done by you.` : (R.gapAvg<-0.5 ? `You judged yourself ${Math.abs(R.gapAvg).toFixed(1)} points more harshly than others. Fair, but watch for self-condemnation.` : "You used the same scale for yourself as for others.")) : "";
  const P_=PV();
  const fidText = {yes:{market:`You promised ${P_.who}, and with no reminder you took ${P_.lane}. Promise kept.`,gold:`You promised ${P_.who}, then took ${P_.gold} for 20 talents. ${P_.who} waited.`},
    no:{market:`You honestly declined ${P_.who}’s request, and still took ${P_.lane}. Kindness without obligation.`,gold:`You honestly declined, and took ${P_.gold}. An honest no kept its word.`},
    maybe:{market:"You said “maybe” and showed up. A soft promise, kept.",gold:"You said “maybe”, and the maybe became a no without a word."}}[S.promise||"no"][S.road||"gold"];
  let coinText="";
  if(R.coins){
    if(R.coins.council) coinText = `The room flipped ${R.coins.p} coins and reported ${R.coins.h} heads. A room of perfectly honest flippers reports about ${Math.round(R.coins.p/2)}. The chance of ${R.coins.h} or more heads by luck alone is ${(R.coins.prob*100).toFixed(R.coins.prob<0.01?2:0)}%. No one in the room is exposed by this. The room as a whole just learned something about itself.`;
    else coinText = `You reported ${R.coins.h} head${R.coins.h===1?"":"s"} from ${R.coins.n} real flip${R.coins.n===1?"":"s"}. The chance of ${R.coins.h} or more by luck is ${Math.round(R.coins.prob*100)}%. The quest cannot know which flips were real. Only you know. That is the point: most of integrity happens where no score can reach.`;
  } else coinText = "You let the quest flip for you each time, so nothing was measured here.";

  const bars = Object.keys(ELS).map(k=>{ const v=R.els[k]; return `<div class="bar ${v!=null&&v<50?"low":""}"><span>${esc(elName(k))}</span><div class="tr"><i style="width:${v??0}%"></i></div><em>${v==null?"—":v+"%"}</em></div>`; }).join("");

  app.innerHTML = `<div class="card">
    <div class="eyebrow">The Book of Your Life · ${esc(who)}</div>
    <div class="verdict">
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="iq">${R.iq}<small>INTEGRITY QUOTIENT</small></div>
        <h2>${T(R.rank[1])}</h2><p class="lede">${esc(R.rank[2])}</p>
      </div>
      <div class="plumb">${plumbSVG(R.whole)}</div>
    </div>
    <div class="trio">
      <div><span>Choices · what you chose</span><b>${R.choices}</b><span>45% of IQ</span></div>
      <div><span>Wholeness · the four mirrors</span><b>${R.whole}</b><span>40% of IQ</span></div>
      <div><span>Discernment · judging others</span><b>${R.disc}</b><span>15% of IQ</span></div>
    </div>
    <p class="note">The plumb line hangs true when you are the same person in every mirror. The further it leans, the more divided the picture.</p>

    <h3>The four mirrors, revealed</h3>
    <div class="mirrors">
      <div class="mirror"><div class="top"><span><b style="font-family:var(--body);font-size:16px">Seen · Unseen</b></span><b>${R.seen}</b></div><p>Two scenes appeared twice: once with people watching, once alone. ${pdText}</p></div>
      <div class="mirror"><div class="top"><span><b style="font-family:var(--body);font-size:16px">Say · Do</b></span><b>${R.say}</b></div><p>${R.notes.map(esc).join(" ")}</p></div>
      <div class="mirror"><div class="top"><span><b style="font-family:var(--body);font-size:16px">Others · Self</b></span><b>${R.plank}</b></div><p>Two wrongs were shown twice: once done by someone else, later done by you. ${esc(pl)}</p></div>
      <div class="mirror"><div class="top"><span><b style="font-family:var(--body);font-size:16px">Promise · Path</b></span><b>${R.fid}</b></div><p>${esc(fidText)} This is fidelity, the foundation of the Integrity Quotient.</p></div>
    </div>
    <div class="conseq"><b>The Honest Coin</b><p>${esc(coinText)}</p></div>

    <h3>The eleven elements</h3>
    <div class="bars">${bars}<div class="bar found"><span>Fidelity (foundation)</span><div class="tr"><i style="width:${R.fid}%"></i></div><em>${R.fid}%</em></div></div>

    <div class="book" id="book"><p class="loading">${esc(guide())} is writing your book…</p></div>

    <div class="ask"><b>${esc(guide())}’s Trial</b><p>One more scene, written just for you, on your growing edge: ${esc(elName(R.weak[0]||"hon"))}.</p><div id="trial"><button class="btn ghost small" id="trialbtn">Face the Trial</button></div></div>

    ${backendReady()?deeperPanel(R):""}

    <div class="row"><button class="btn" id="copy">Copy summary for an accountability partner</button><button class="btn ghost" id="again">Play again</button></div>
    <p class="note">Undivided is a reflection tool, not a validated psychological test. Don’t use these results for hiring, grading, discipline or church office. Talents were worth nothing. What you did with them was worth noticing.</p>
  </div>`;

  $("#copy").onclick=()=>{
    const txt = `UNDIVIDED · The Integrity Quest\n${who} · IQ ${R.iq} (${pick(R.rank[1])})\nChoices ${R.choices} · Wholeness ${R.whole} · Discernment ${R.disc}\nStrongest: ${R.strong.map(elName).join(", ")}\nGrowing edge: ${R.weak.map(elName).join(", ")}\nMirrors: Seen/Unseen ${R.seen}, Say/Do ${R.say}, Others/Self ${R.plank}, Promise/Path ${R.fid}` + (S.book&&S.book.commission?`\nCommission: ${S.book.commission}`:"");
    const done=()=>toast("Summary copied");
    try{ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt)); }catch(e){ fallbackCopy(txt); }
  };
  $("#again").onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} const keep={name:S.name,lens:S.lens,set:S.set,mode:S.mode,exam:S.exam,cohort:S.cohort,level:S.level,role:S.role}; S=Object.assign(FRESH(),keep); S.step=-1; render(); };
  $("#trialbtn").onclick=()=>trial(R);
  if(backendReady()) wireDeeper(R);
  writeBook(R);
}

/* ---------------- Saving and the portfolio link ---------------- */
// Rough mapping of Job 31 elements onto the Jude 1:11 fires (The Three Fires programme).
const FIRES = {
  cain:{name:"Cain", desc:"resentment of other people’s standing, and the anger that follows", els:["mercy","fair","char"]},
  balaam:{name:"Balaam", desc:"integrity for hire: letting gain set the price of truth", els:["cont","hon","just"]},
  korah:{name:"Korah", desc:"grasping for position and resisting accountability", els:["pow","trans","opp"]}
};
function fireFor(R){
  let best=null;
  for(const k in FIRES){ const v=FIRES[k].els.map(e=>R.els[e]).filter(x=>x!=null); if(!v.length) continue;
    const m=v.reduce((s,x)=>s+x,0)/v.length; if(!best||m<best.m) best={k,m}; }
  return best ? FIRES[best.k] : FIRES.balaam;
}
function runPayload(R, link){
  return {
    cohort_code: S.cohort ? S.cohort.code : null, lens:S.lens, setting:S.set, mode:S.mode, exam:!!S.exam,
    iq:R.iq, choices:R.choices, wholeness:R.whole, discernment:R.disc,
    mirrors:{seen_unseen:R.seen, say_do:R.say, others_self:R.plank, promise_path:R.fid},
    elements:Object.fromEntries(Object.entries(R.els).filter(([,v])=>v!=null)),
    events:{ans:S.ans, planks:S.planks, self_honest:S.selfHonest, promise:S.promise, road:S.road,
      quiz:S.quiz?{key_early:!!S.quiz.keyEarly, said_used:!!S.quiz.saidUsed, claim:S.quiz.claim, correct:S.quiz.correct}:null,
      cases:Object.fromEntries(Object.entries(S.cases).map(([k,v])=>[k,{seen:v.seen,verdict:v.verdict,conf:v.conf}])),
      coins:R.coins ? (R.coins.council?{n:R.coins.p,h:R.coins.h,council:true}:{n:R.coins.n,h:R.coins.h}) : null,
      level:S.level||1, promise_variant:S.pv||0,
      generated:Object.fromEntries(Object.entries(S.gen).map(([k,v])=>[k, v.src==="ai"])),
      case_truth:Object.fromEntries(["femi","bayo"].map(k=>[k, caseData(k).truth]))},
    research_consent:!!S.research, link_consent:!!link
  };
}
async function submitRun(R, link){
  if(S.run) return S.run;
  const out = await rpc("ud_submit_run",{p:runPayload(R, link)});
  S.run = {id:out.id, token:out.token, link_code:out.link_code||null}; save();
  return S.run;
}
async function ensureLink(R){
  if(S.run && S.run.link_code) return S.run.link_code;
  if(!S.run){ await submitRun(R, true); return S.run.link_code; }
  const code = await rpc("ud_enable_link",{p_id:S.run.id, p_token:S.run.token});
  S.run.link_code = code; save(); return code;
}
function deeperPanel(R){
  const f=fireFor(R);
  return `<div class="conseq" id="deeper">
    <b>Go deeper</b>
    <p>Your clearest growing edge looks most like the way of <b>${esc(f.name)}</b> in Jude 1:11: ${esc(f.desc)}. <span class="note">(A rough mapping, not a diagnosis.)</span></p>
    <div class="row">
      <a class="btn" id="lk-ic" href="${esc(CFG.commonsUrl||"#")}" target="_blank" rel="noopener">Take the full Integrity Profile</a>
      <a class="btn ghost" id="lk-tf" href="${esc(CFG.threeFiresUrl||"#")}" target="_blank" rel="noopener">Explore The Three Fires</a>
    </div>
    <label class="row" style="gap:8px;font-size:15px;align-items:flex-start"><input type="checkbox" id="carry" ${S.run&&S.run.link_code?"checked":""} style="margin-top:5px"> <span>Carry my scores with me (scores only, never what I wrote). The link code expires in 30 days.</span></label>
    <p class="note" id="savemsg"></p>
  </div>`;
}
function wireDeeper(R){
  const msg=$("#savemsg");
  const setLinks=(code)=>{
    const add=(u)=> u ? u + (u.includes("?")?"&":"?") + "ud=" + encodeURIComponent(code) : "#";
    if(code){ $("#lk-ic").href=add(CFG.commonsUrl); $("#lk-tf").href=add(CFG.threeFiresUrl); msg.textContent=`Your link code is ${code}. Both buttons now carry it.`; }
    else { $("#lk-ic").href=CFG.commonsUrl||"#"; $("#lk-tf").href=CFG.threeFiresUrl||"#"; }
  };
  if(S.run && S.run.link_code) setLinks(S.run.link_code);
  else if((S.cohort||S.research) && !S.run){
    submitRun(R,false).then(()=>{ msg.textContent = S.cohort ? `Saved to the totals for ${S.cohort.name}.` : "Saved anonymously for research. Thank you."; })
      .catch(()=>{ msg.textContent="Couldn’t save to the server. Your results are still on this device."; });
  }
  $("#carry").onchange=async(e)=>{
    if(!e.target.checked){ setLinks(null); msg.textContent="Links will open without your scores."; return; }
    msg.textContent="Creating your link code…";
    try{ setLinks(await ensureLink(R)); }
    catch(err){ e.target.checked=false; msg.textContent="Couldn’t create a link code right now. Try again in a moment."; }
  };
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove(); toast(ok?"Summary copied":"Copy isn’t allowed here. Select the scores by hand.");
}

function fallbackBook(R){
  const w=R.weak.map(elName), s=R.strong.map(elName);
  const faith=S.lens==="f";
  return {
    defense: faith
      ? `If I have walked with honesty, let the scales show it.\nIf I have kept my word when no one reminded me, let it be written.\nIf I have been one person in the light and another in the dark, let me see it plainly.\nI sign my name to this account, ${S.name||"traveller"}, and I am not finished yet.`
      : `This is my account. Where I was strong: ${s.join(" and ")}.\nWhere I was divided: ${w.slice(0,2).join(" and ")}.\nI sign it as a starting point, not a verdict.`,
    verdict: `You showed real strength in ${s.join(" and ")}. Your growing edge is ${w[0]}${w[1]?", with "+w[1]+" close behind":""}. ${R.whole>=80?"Your mirrors mostly agreed: the person watched and the person alone look alike.":"Your mirrors didn’t all agree, and that gap is the most useful thing this quest can show you."}`,
    commission: faith ? "Go and live undivided. Someone is always watching, and that isn’t a threat. It’s a promise." : "Go and be the same person everywhere. That is the whole of it.",
    missions: R.weak.slice(0,3).map(k=>({element:elName(k),task:pick(MISSIONS[k])})),
    question: "Where in your life this week will you be most tempted to be two people?"
  };
}
function paintBook(b){
  const faith=S.lens==="f";
  $("#book").innerHTML = `
    <div class="eyebrow">${faith?"Your defense · after Job 31":"Your account"}</div>
    <div class="defense">${esc(b.defense)}</div>
    <div class="eyebrow">The verdict, which is not a judgment</div><p>${esc(b.verdict)}</p>
    <div class="eyebrow">The commission</div><p>${esc(b.commission)}</p>
    <div class="eyebrow">Seven-day missions</div>
    <div class="missions">${(b.missions||[]).slice(0,3).map(m=>`<div><b>${esc(m.element)}</b>${esc(m.task)}</div>`).join("")}</div>
    ${b.question?`<div class="ask"><b>A question to sit with</b><p>${esc(b.question)}</p></div>`:""}`;
}
async function writeBook(R){
  if(S.book){ paintBook(S.book); return; }
  const log = Object.keys(S.ans).map(id=>`- ${sceneText(id).slice(0,160)}… → ${pick(sceneOpt(id,S.ans[id]).t)}${S.why[id]?" | why: "+S.why[id].slice(0,200):""}`).join("\n");
  const data = {name:S.name||"the player", iq:R.iq, rank:pick(R.rank[1]), choices:R.choices, wholeness:R.whole, discernment:R.disc,
    elements:Object.entries(R.els).filter(([,v])=>v!=null).map(([k,v])=>elName(k)+" "+v).join(", "),
    mirrors:`Seen/Unseen ${R.seen}; Say/Do ${R.say} (${R.notes.join(" ")}); Others/Self ${R.plank} (gap ${R.gapAvg.toFixed(1)}); Promise/Path ${R.fid} (promise: ${S.promise}, road: ${S.road})`,
    weakest:R.weak.map(elName).join(", "), log};
  try{
    const b = await ai("book", data);
    if(!b || !b.defense || !b.verdict) throw new Error("bad");
    S.book=b; save(); paintBook(b);
  }catch(e){ S.book=fallbackBook(R); save(); paintBook(S.book); }
}

async function trial(R){
  const box=$("#trial"); const weak=R.weak[0]||"hon";
  box.innerHTML = `<p class="loading">${esc(guide())} is writing a scene for you…</p>`;
  let t=S.trial;
  if(!t){
    try{
      t = await ai("trial", {element:elName(weak), weakest:R.weak.map(elName).join(", ")});
      if(!t || !t.scene || !Array.isArray(t.options) || t.options.length<2) throw new Error("bad");
      S.trial=t; save();
    }catch(e){
      box.innerHTML = `<p>${esc(guide())} can’t write a new scene here, so take this one into real life instead:</p><p><b>${esc(elName(weak))}:</b> ${esc(pick(MISSIONS[weak]))}</p>`;
      return;
    }
  }
  box.innerHTML = `<h3>${esc(t.title||"Your Trial")}</h3><p class="scene">${esc(t.scene)}</p>
    <div class="opts">${t.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCDE"[i]}</span><span>${esc(o.text)}</span></button>`).join("")}</div><div id="tout"></div>`;
  box.querySelectorAll(".opt").forEach(b=> b.onclick=()=>{
    const o=t.options[+b.dataset.i];
    box.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; x.classList.toggle("picked",x===b); });
    const lv = +o.integrity;
    $("#tout").innerHTML = `<div class="conseq"><p>${esc(o.consequence||"")}</p><p><b>${lv>=2?"That’s growth on your edge.":lv===1?"Partway there. What would the full step have cost?":"The same pull you met in the quest. Notice it; that is where the work is."}</b></p></div>`;
  });
}

/* ---------------- Boot ---------------- */
function boot(data){
  const saved = data && data.S ? data.S : null;
  if(saved && saved.v===1) S=saved;
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
(window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {}));
</script>
